<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Data Capture</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme: #399051;
      --themeHover: #2e8546;
    }
    * {
      font-family: "Montserrat", sans-serif !important;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f3f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0px 4px 25px 0px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 400px;
    }
    .login-container h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .btn-success {
      width: 100%;
      background-color: var(--theme);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn-success:hover {
      background-color: var(--themeHover);
    }
    .alert {
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
    }
    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
    }
    .text-center {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
    .text-center a {
      color: var(--theme);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <div id="error-message" class="alert alert-danger"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn-success">Masuk</button>
    </form>
    <div class="text-center">
      Belum punya akun? <a href="/daftar.html">Daftar disini</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      
      try {
        // Correct implementation ✅
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: emailInputValue,  // Make sure this is "email", not "Email" or "username"
                password: passwordInputValue 
            })
        });
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('userSession', JSON.stringify({ token: data.token, object: data.user }));
          window.location.href = '/';
        } else {
          errorDiv.innerText = data.message || 'Login gagal';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.innerText = 'Terjadi kesalahan pada server';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
